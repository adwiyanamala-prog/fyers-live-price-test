<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="bullGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#glowGrad)" stroke-width="4" opacity="0.4" />

  <!-- Candlestick 1: Bullish Breakout -->
  <line x1="160" y1="120" x2="160" y2="400" stroke="#34d399" stroke-width="6" stroke-linecap="round" />
  <rect x="136" y="180" width="48" height="150" rx="8" fill="url(#bullGrad)" filter="url(#glow)" />

  <!-- Candlestick 2: Continuation -->
  <line x1="256" y1="80" x2="256" y2="360" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
  <rect x="232" y="130" width="48" height="180" rx="8" fill="#0284c7" filter="url(#glow)" />

  <!-- Candlestick 3: Peak Momentum -->
  <line x1="352" y1="60" x2="352" y2="320" stroke="#a7f3d0" stroke-width="6" stroke-linecap="round" />
  <rect x="328" y="90" width="48" height="160" rx="8" fill="#10b981" filter="url(#glow)" />

  <!-- Lightning Arrow Overlay -->
  <path d="M 120 370 Q 240 280 390 130" fill="none" stroke="#facc15" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />
  <polygon points="380,105 420,120 395,155" fill="#facc15" />

  <!-- Brand Signature Terminal Text -->
  <text x="256" y="450" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="4">
    ADWIKETAN
  </text>
  <text x="256" y="480" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-weight="700" font-size="18" letter-spacing="3">
    TRADING DESK
  </text>
</svg>
